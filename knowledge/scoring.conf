# Orcs reward score — weights and references (deterministic; see
# docs/superpowers/specs/2026-11-07-orcs-reward-score-design.md).
# Changing these is an owner-approved upskill change. Every history record stores the
# values it was scored with, so old scores stay explainable.

# Weights — must sum to 100.
W_CORRECTNESS=35
W_QUALITY=20
W_SATISFACTION=20
W_TOKENS=10
W_SPEED=10
W_COMPLETION=5

# Final score cap when any approved BR-ID does not pass.
QUALITY_CAP=60

# Process-quality penalties per occurrence (subtracted from 1.0, floor 0).
P_SCOPE_REJECTION=0.10
P_REWORK=0.05
P_ESCALATION=0.05
P_BLOCKER=0.03
P_BUDGET_BREACH=0.15

# References per approved BR-ID: meeting them earns the full factor.
REF_TOKENS_PER_BR=150000
REF_MINUTES_PER_BR=15

# Effective tokens = input + output + cache_creation + CACHE_READ_WEIGHT x cache_read
CACHE_READ_WEIGHT=0.1
